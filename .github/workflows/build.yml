name: Build Android APK

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-v4-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-v4-

      # Write license hash files directly into Buildozer's own SDK path.
      # This is the actual fix — the sdkmanager checks for these files,
      # not for interactive input, when running non-interactively.
      - name: Pre-accept Android SDK licenses
        run: |
          SDK_LICENSES=~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p "$SDK_LICENSES"

          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' \
            > "$SDK_LICENSES/android-sdk-license"

          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' \
            > "$SDK_LICENSES/android-sdk-preview-license"

          printf '\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n' \
            > "$SDK_LICENSES/google-gdk-license"

          echo "License files written:"
          ls -la "$SDK_LICENSES"

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip \
            openjdk-17-jdk \
            autoconf libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            build-essential \
            ccache

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0 cython==3.0.3

      - name: Build APK
        run: buildozer -v android debug

      - name: Show build result
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -lah bin/ 2>/dev/null || echo "bin/ not created"
          echo "=== Disk ==="
          df -h

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BWS-Tracker-APK
          path: bin/*.apk
          if-no-files-found: error
